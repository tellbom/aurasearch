services:
  vespa:
    image: vespaengine/vespa:8.721.11@sha256:b03347e1fdc29667c8d4656f5e19ee21d2a2195d11e629d7f42432bba144da3e
    hostname: vespa
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "${VESPA_CPU_LIMIT:-4}"
          memory: "${VESPA_MEMORY_LIMIT:-8G}"
    volumes:
      - vespa-var:/opt/vespa/var
      - vespa-logs:/opt/vespa/logs
      - ./application:/application:ro
    networks:
      - search-internal
    expose:
      - "8080"
      - "19071"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:19071/state/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  vespa-var:
  vespa-logs:

networks:
  search-internal:
    name: ${SEARCH_NETWORK:-dual-news-search}
    external: true
